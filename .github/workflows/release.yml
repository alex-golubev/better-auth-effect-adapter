name: Release

# Publishes to npm when a version tag is pushed. npm authenticates the workflow through
# trusted publishing (OIDC), so no npm token is stored, and the package gets provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm biome ci .
      - run: pnpm test:all
      - run: pnpm build
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: npm publish --provenance --access public --ignore-scripts
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file notes.md
